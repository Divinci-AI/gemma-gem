<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divinci Local Inference</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <img src="/icon/48.png" alt="Divinci" width="32" height="32" />
      <div>
        <h1>Divinci Local Inference</h1>
        <p class="subtitle">Gemma 4, on your GPU</p>
      </div>
    </header>

    <section id="status">
      <div class="status-row">
        <span class="status-label" title="The model currently in your GPU memory. Cleared by Unload.">GPU memory</span>
        <span class="status-value" id="status-model">—</span>
      </div>
      <div class="status-row">
        <span class="status-label" title="Chats waiting their turn (one generation runs at a time).">Queue depth</span>
        <span class="status-value" id="status-queue">—</span>
      </div>
      <div class="status-row">
        <span class="status-label" title="Model files cached in the browser. Survives Unload — re-loading is fast (no re-download).">Disk cache</span>
        <span class="status-trailing">
          <span class="status-value" id="status-disk">—</span>
          <button id="clear-cache-btn" class="inline-action" hidden title="Delete cached model files. Future loads will re-download.">Clear</button>
        </span>
      </div>
      <div id="status-progress" class="status-progress" hidden>
        <div class="progress-label">
          <span id="progress-file">—</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </section>

    <div id="error-toast" class="error-toast" hidden>
      <span id="error-text"></span>
      <button id="error-dismiss" class="error-dismiss" aria-label="Dismiss">×</button>
    </div>

    <section id="models">
      <div class="model-card" data-model-id="gemma-4-e2b">
        <div class="model-meta">
          <strong>Gemma 4 E2B
            <span class="cache-badge" data-cache-badge="gemma-4-e2b" hidden>cached</span>
          </strong>
          <span class="model-size">~2.9 GB · text-only · <span class="model-cache-detail" data-cache-detail="gemma-4-e2b">not cached — first load downloads</span></span>
        </div>
        <button class="model-action" data-action="load" data-model-id="gemma-4-e2b">Load</button>
      </div>
      <button id="unload-btn" class="unload-action" hidden>Unload model from GPU</button>
    </section>

    <section id="settings">
      <details>
        <summary>Inference defaults</summary>
        <div class="setting-row">
          <label for="setting-temperature" title="0 = deterministic / greedy. >0 enables sampling.">Temperature</label>
          <input type="number" id="setting-temperature" min="0" max="2" step="0.1" />
        </div>
        <div class="setting-row">
          <label for="setting-max-tokens" title="Hard cap on tokens per generation.">Max new tokens</label>
          <input type="number" id="setting-max-tokens" min="1" max="8192" step="1" />
        </div>
        <p class="setting-note">
          Web-app per-call values override these. Saved automatically.
        </p>
      </details>
    </section>

    <footer>
      <a href="https://github.com/Divinci-AI/gemma-gem" target="_blank" rel="noopener">Source</a>
      <span>·</span>
      <span id="version">v—</span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
